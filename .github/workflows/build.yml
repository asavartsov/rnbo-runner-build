name: Build and Upload Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      rnbo_source_ver:
        description: RNBO source package version
        required: false
        type: string
      rnbo_runner_ref:
        description: RNBO runner tag, branch, or commit
        required: false
        type: string
      rnbo_runner_panel_ref:
        description: RNBO runner panel tag, branch, or commit
        required: false
        type: string
      rnbo_runner_panel_package_version:
        description: Optional panel package version
        required: false
        type: string
      jack_transport_link_ref:
        description: JACK Transport Link tag, branch, or commit
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Debian packages
        env:
          RNBO_SOURCE_VER: ${{ inputs.rnbo_source_ver }}
          RNBO_RUNNER_REF: ${{ inputs.rnbo_runner_ref }}
          RNBO_RUNNER_PANEL_REF: ${{ inputs.rnbo_runner_panel_ref }}
          RNBO_RUNNER_PANEL_PACKAGE_VERSION: ${{ inputs.rnbo_runner_panel_package_version }}
          JACK_TRANSPORT_LINK_REF: ${{ inputs.jack_transport_link_ref }}
        run: |
          build_args=()
          for name in \
            RNBO_SOURCE_VER \
            RNBO_RUNNER_REF \
            RNBO_RUNNER_PANEL_REF \
            RNBO_RUNNER_PANEL_PACKAGE_VERSION \
            JACK_TRANSPORT_LINK_REF
          do
            if [[ -n "${!name}" ]]; then
              build_args+=(--build-arg "$name=${!name}")
            fi
          done

          docker buildx build \
            "${build_args[@]}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output type=local,dest=./output \
            --progress=plain .

      - name: List built files
        run: ls -lh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages-${{ matrix.arch }}
          path: output/*.deb

  upload:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: debian-packages-arm64
          path: output

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          files: output/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
